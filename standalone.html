                        onClick={() => setSelectedProject(project)}
                        className="w-full flex items-center justify-center gap-2 bg-neutral-900 hover:bg-white hover:text-black border border-neutral-800 text-white font-mono text-xs py-2.5 rounded transition-all"
                      >
                        <span>Explore System Details</span>
                        <Icon name="arrow-up-right" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* RESEARCH SECTION */}
            <section id="research" className="py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-b border-neutral-900">
              <div className="flex items-center gap-3 mb-12">
                <div className="w-8 h-[2px] bg-white" />
                <h2 className="text-xs font-mono tracking-widest text-neutral-400 uppercase">04 // In-Progress Research</h2>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                {researchData.map((res) => (
                  <div key={res.id} className="bg-neutral-950 border border-neutral-800 rounded-lg p-8 space-y-6">
                    <div className="flex items-center gap-3">
                      <div className="p-3 bg-neutral-900 border border-neutral-800 rounded text-white">
                        <Icon name={res.iconName} className="w-6 h-6" />
                      </div>
                      <div>
                        <span className="font-mono text-[10px] bg-neutral-900 border border-neutral-700 px-2.5 py-1 rounded text-white font-semibold">
                          {res.status}
                        </span>
                        <h3 className="text-2xl font-bold text-white mt-1">{res.title}</h3>
                      </div>
                    </div>
                    <p className="text-sm font-mono text-neutral-300 italic border-l-2 border-white pl-4">"{res.desc}"</p>
                    <p className="text-xs text-neutral-400">{res.details}</p>
                  </div>
                ))}
              </div>
            </section>

            {/* RISK SIMULATOR SECTION */}
            <section id="risk-sim" className="py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-b border-neutral-900">
              <div className="flex items-center gap-3 mb-8">
                <div className="w-8 h-[2px] bg-white" />
                <h2 className="text-xs font-mono tracking-widest text-neutral-400 uppercase">05 // Interactive Student Capital Allocation Simulator</h2>
              </div>

              <div className="bg-neutral-950 border border-neutral-800 rounded-lg p-6 sm:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-6 space-y-6">
                  <h3 className="text-xl font-bold text-white">Purchase Risk Simulator</h3>
                  <div className="space-y-4 text-xs font-mono">
                    <div>
                      <div className="flex justify-between mb-1">
                        <span>Purchase Price (₹)</span>
                        <span className="font-bold">₹{calcData.purchasePrice.toLocaleString()}</span>
                      </div>
                      <input
                        type="range" min="1000" max="100000" step="1000"
                        value={calcData.purchasePrice}
                        onChange={(e) => setCalcData({ ...calcData, purchasePrice: Number(e.target.value) })}
                        className="w-full accent-white bg-neutral-800 h-1.5 rounded"
                      />
                    </div>
                    <div>
                      <div className="flex justify-between mb-1">
                        <span>Liquidity Reserve (₹)</span>
                        <span className="font-bold">₹{calcData.currentLiquidity.toLocaleString()}</span>
                      </div>
                      <input
                        type="range" min="5000" max="200000" step="5000"
                        value={calcData.currentLiquidity}
                        onChange={(e) => setCalcData({ ...calcData, currentLiquidity: Number(e.target.value) })}
                        className="w-full accent-white bg-neutral-800 h-1.5 rounded"
                      />
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-6 bg-neutral-900 border border-neutral-800 rounded-lg p-6 space-y-4">
                  <div className="flex justify-between border-b border-neutral-800 pb-3">
                    <span className="text-xs font-mono text-neutral-400">DECISION STATUS</span>
                    <span className={`px-3 py-1 rounded text-xs font-mono border ${riskBadgeStyle}`}>{riskStatus}</span>
                  </div>
                  <div className="flex justify-between items-baseline">
                    <span className="text-xs font-mono text-neutral-400">Risk Score:</span>
                    <span className="text-3xl font-extrabold text-white font-mono">{riskIndex} / 100</span>
                  </div>
                </div>
              </div>
            </section>

            {/* FOOTER & CONTACT */}
            <section id="contact" className="py-24 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
              <div className="flex items-center gap-3 mb-12">
                <div className="w-8 h-[2px] bg-white" />
                <h2 className="text-xs font-mono tracking-widest text-neutral-400 uppercase">06 // Initiate Contact & Profiles</h2>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                <div className="lg:col-span-5 space-y-6">
                  <h3 className="text-3xl font-extrabold text-white">Let's Connect</h3>
                  <div className="p-4 bg-neutral-950 border border-neutral-800 rounded flex items-center justify-between">
                    <span className="font-mono text-xs text-white">pranavpoola69@gmail.com</span>
                    <button onClick={handleCopyEmail} className="bg-neutral-900 hover:bg-white hover:text-black text-white p-2 rounded">
                      {copiedEmail ? <Icon name="check" className="w-4 h-4" /> : <Icon name="copy" className="w-4 h-4" />}
                    </button>
                  </div>
                  <div className="space-y-3 font-mono text-xs">
                    <a href="https://www.linkedin.com/in/pskpranav" target="_blank" className="flex items-center justify-between p-4 bg-neutral-950 border border-neutral-800 rounded text-neutral-300 hover:border-white">
                      <span>LinkedIn // www.linkedin.com/in/pskpranav</span>
                      <Icon name="arrow-up-right" className="w-4 h-4" />
                    </a>
                    <a href="https://github.com/Pskp6769" target="_blank" className="flex items-center justify-between p-4 bg-neutral-950 border border-neutral-800 rounded text-neutral-300 hover:border-white">
                      <span>GitHub // Pskp6769</span>
                      <Icon name="arrow-up-right" className="w-4 h-4" />
                    </a>
                  </div>
                </div>

                <div className="lg:col-span-7 bg-neutral-950 border border-neutral-800 rounded p-6">
                  <h4 className="text-lg font-bold text-white font-mono mb-4">Direct Message</h4>
                  <form onSubmit={(e) => { e.preventDefault(); alert('Message sent!'); }} className="space-y-4">
                    <input type="text" required placeholder="Your Name" className="w-full bg-black border border-neutral-800 p-3 text-xs text-white font-mono rounded" />
                    <input type="email" required placeholder="Your Email" className="w-full bg-black border border-neutral-800 p-3 text-xs text-white font-mono rounded" />
                    <textarea rows={4} required placeholder="Message" className="w-full bg-black border border-neutral-800 p-3 text-xs text-white font-mono rounded" />
                    <button type="submit" className="w-full bg-white text-black font-bold font-mono text-xs py-3 rounded">Send Transmission</button>
                  </form>
                </div>
              </div>

              <div className="mt-20 pt-8 border-t border-neutral-900 text-xs font-mono text-neutral-500 flex justify-between">
                <div>&copy; {new Date().getFullYear()} Pranav (పిఎస్केP)</div>
                <div>SRMIST CSE '29</div>
              </div>
            </section>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PortfolioApp />);
  </script>
</body>
</html>
